<div id="modalMagicpassTopluPlan" class="modal-overlay">
    <div class="modal-card" style="max-width:980px;">
        <div class="modal-header"><h3>👥 Toplu Vardiya Planlama</h3><button class="modal-close" onclick="magicpassTopluPlanlamaKapat()">✕</button></div>
        <div class="modal-body">
            <div class="form-row">
                <div class="form-group"><label>Şube</label><select id="magicTopluSube" onchange="magicpassTopluPersonelleriCiz()"><option value="">Tüm şubeler</option></select></div>
                <div class="form-group"><label>Görev</label><select id="magicTopluGorev" onchange="magicpassTopluPersonelleriCiz()"><option value="">Tüm görevler</option></select></div>
                <div class="form-group"><label>Mevcut Vardiya</label><select id="magicTopluMevcut" onchange="magicpassTopluPersonelleriCiz()"><option value="">Tümü</option><option value="gunduz">Gündüz</option><option value="gece">Gece</option></select></div>
            </div>
            <div style="display:flex;gap:8px;margin-bottom:8px;"><button type="button" class="btn-modern btn-detail-modern" onclick="magicpassTopluTumunuSec(true)">Tümünü Seç</button><button type="button" class="btn-modern" onclick="magicpassTopluTumunuSec(false)">Seçimi Temizle</button><strong id="magicTopluSecimSayisi" style="margin-left:auto;color:#0369a1;">0 personel</strong></div>
            <div id="magicTopluPersoneller" class="magicpass-personel-listesi"></div>
            <div class="form-row" style="margin-top:14px;">
                <div class="form-group"><label>Başlangıç Tarihi</label><input id="magicTopluBaslangic" type="date" required></div>
                <div class="form-group"><label>Bitiş Tarihi</label><input id="magicTopluBitis" type="date" required></div>
                <div class="form-group"><label>Uygulanacak Vardiya</label><select id="magicTopluVardiya"><option value="gunduz">Gündüz</option><option value="gece">Gece</option><option value="izin">İzin / Çalışma yok</option></select></div>
            </div>
            <label style="display:flex;gap:8px;align-items:center;margin:8px 0 12px;font-weight:750;"><input id="magicTopluSadeceBos" type="checkbox"> Yalnızca boş günlere ata</label>
            <div id="magicTopluUyari" style="padding:10px;border-radius:8px;background:#f8fafc;color:#475569;margin-bottom:12px;"></div>
            <div style="display:flex;justify-content:flex-end;gap:10px;"><button type="button" class="btn-cancel" style="margin:0;" onclick="magicpassTopluPlanlamaKapat()">İptal</button><button type="button" class="btn-submit" style="width:auto;margin:0;" onclick="magicpassTopluVardiyaUygula()">Seçili Personellere Uygula</button></div>
        </div>
    </div>
</div>
