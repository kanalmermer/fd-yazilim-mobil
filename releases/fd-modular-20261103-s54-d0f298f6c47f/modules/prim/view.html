<div id="modalPrimHakki" class="modal-overlay">
    <div class="modal-card" style="max-width:560px; border:3px solid #dc2626;">
        <div class="modal-header" style="background:#b91c1c;">
            <h3>⚠️ Prim Hakkı Manuel Değişiklik</h3>
            <button class="modal-close" onclick="closePrimHakkiModal()">✕</button>
        </div>
        <div class="modal-body" style="padding:26px;">
            <div style="background:#fef2f2; color:#991b1b; border:1px solid #fecaca; border-radius:12px; padding:18px; font-size:1rem; font-weight:750; line-height:1.55;">
                Dikkat: Bu işlem çizelgedeki otomatik hesaplamayı geçersiz kılar. Seçtiğiniz prim hakkı durumu ilgili personel için bu ayın Puantaj kaydına manuel karar olarak kaydedilecektir.
            </div>
            <p id="manuelPrimPersonel" style="font-size:1.05rem; font-weight:800; margin:22px 0 10px;"></p>
            <label style="font-weight:800; color:#334155;">Manuel prim hakkı kararı</label>
            <select id="manuelPrimHakki" style="width:100%; margin-top:8px; padding:12px; font-size:1rem; font-weight:800;">
                <option value="Var">🟢 Hakkı Var</option>
                <option value="Yok">🔴 Hakkı Yok</option>
            </select>
            <div style="display:flex; gap:10px; margin-top:24px;">
                <button type="button" class="btn-cancel" style="margin-top:0;" onclick="closePrimHakkiModal()">Vazgeç</button>
                <button type="button" class="btn-submit" style="margin-top:0; background:#b91c1c;" onclick="manuelPrimHakkiniKaydet()">Kararı Onayla ve Kaydet</button>
            </div>
        </div>
    </div>
</div>
<label id="puanPrimFiltreWrap" class="puan-filtre-alani"><span>Prim durumu</span><select id="puanPrimFiltre" onchange="renderPuantajMatrisi()">
                            <option value="hak-eden">🟢 Prim Hakkı Olanlar</option>
                            <option value="hak-etmeyen">🔴 Prim Hakkı Olmayanlar</option>
                            <option value="tum" selected>Tüm Prim Personeli</option>
                        </select></label>
<label id="puanPrimTutarWrap" class="puan-filtre-alani" style="display:none"><span>Standart Prim</span><input id="puanPrimSabitTutar" type="text" inputmode="decimal" value="2.000" oninput="paraGirisiFormatla(this)" onchange="primSabitTutariniKaydet(this)"></label>
